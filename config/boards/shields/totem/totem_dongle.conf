CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# As the split central, the dongle needs a connection/bond slot for each peripheral
# (2 halves) plus each BLE host profile (5). Without this the central runs out of
# bond slots and evicts peripheral bonds, causing constant connect/disconnect cycling.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# USB-powered dongle: never deep sleep, so the display and BLE links stay alive.
CONFIG_ZMK_SLEEP=n

# The dongle is the split central: fetch and proxy the halves' battery levels.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Prospector status screen preferences
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y

# Ambient light sensor is a clone APDS9960 (reports chip id 0x9f), which the
# stock driver rejects. The keymap retargets the node to "zmk,apds9960" so the
# vendored clone-tolerant driver binds it (Prospector force-selects the stock
# APDS9960 driver, but with no matching node it stays inert).
CONFIG_APDS9960C=y

# USB Logging (TEMPORARY - for diagnosing the split reconnect loop).
# Revert once the disconnect reason is captured.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
