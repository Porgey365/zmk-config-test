# Shared settings applied to every TOTEM build (left, right, dongle).
# Hardware-specific options live in the per-shield .conf files under
# config/boards/shields/totem/ so they don't leak into builds that break on them.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
